# ----------------------------------------------------------------------
# AI / LLM Configuration
# Primary Engine: FreeLLMAPI (https://github.com/tashfeenahmed/freellmapi)
# ----------------------------------------------------------------------
[ai]
provider = "freellmapi"
base_url = "http://localhost:3001/v1"   # FreeLLMAPI unified router endpoint
model    = "auto"                       # Auto-routes across all configured free providers

# ----------------------------------------------------------------------
# Optimal Audience Timing & Rate-Limit Scheduler
# ----------------------------------------------------------------------
[scheduler]
enabled = true                  # Enforces optimal time slots and daily safety caps
timezone = "Asia/Kolkata"       # All times are in IST (UTC+05:30)
advance_prep_minutes = 60       # Wake up 60 min before slot to prepare/render video

# Max uploads per day per platform — evenly spread across defined slots:
#   YouTube  : 11-12 slots/day (morning / afternoon / evening)
#   Instagram: 10 slots/day    (morning / evening)
#   Facebook : 10 slots/day    (morning / evening)
max_daily_youtube   = 10
max_daily_instagram = 10
max_daily_facebook  = 10

# ----------------------------------------------------------------------
# Hands-Free Channel Auto-Pilot
# Automatically watches creator channels and queues new uploads into links.txt
# ----------------------------------------------------------------------
[autopilot]
enabled = true
poll_interval_minutes = 15      # Check every 15 minutes
ignore_shorts = true            # Strictly filter out Shorts; only take full-length regular videos
queue_latest_on_start = true    # Automatically queues videos on start, no manual links.txt entry needed!
# How many of the newest full-length videos to queue per channel each sync/poll
# (1 = only the very latest upload). 3 queues the latest + 2 most recent videos.
recent_per_channel = 3

