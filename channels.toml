# Numeric Instagram Professional Account ID from the Meta Graph API
user_id = "17841432791787477"

[facebook]
# Numeric Facebook Page ID connected to the Instagram professional account
page_id = "1231108530089378"

# ----------------------------------------------------------------------
# AI / LLM Configuration
# Primary Engine: Official Groq API
# ----------------------------------------------------------------------
[ai]
provider = "groq"
model    = "qwen/qwen3.8-27b"

# ----------------------------------------------------------------------
# Optimal Audience Timing & Rate-Limit Scheduler
# ----------------------------------------------------------------------
[scheduler]
enabled = true                  # Enforces optimal time slots and daily safety caps
timezone = "Asia/Kolkata"       # All times are in IST (UTC+05:30)
advance_prep_minutes = 60       # Wake up 60 min before slot to prepare/render video

# Max uploads per day per platform — evenly spread across defined slots:
#   YouTube  : 11-12 slots/day x 3 videos/slot = ~35/day
#   Instagram: 10 slots/day x 3 videos/slot = ~30/day
#   Facebook : 10 slots/day x 3 videos/slot = ~30/day
max_daily_youtube   = 50
max_daily_instagram = 50
max_daily_facebook  = 50
min_uploads_per_slot = 3

# ----------------------------------------------------------------------
# Hands-Free Channel Auto-Pilot
# Automatically watches creator channels and queues new uploads into links.txt
# ----------------------------------------------------------------------
[autopilot]
enabled = true
poll_interval_minutes = 15      # Check every 15 minutes
ignore_shorts = true            # Strictly filter out Shorts; only take full-length regular videos
queue_latest_on_start = true    # Automatically queues latest videos on start, no manual links.txt entry needed!

