<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="topBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="bottomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <linearGradient id="neonHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="subGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .header-text { font-weight: 800; font-size: 18px; fill: #FFFFFF; }
    .sub-text { font-weight: 500; font-size: 13px; fill: #94A3B8; }
    .tag-text { font-weight: 700; font-size: 12px; fill: #F8FAFC; }
    .karaoke-word { font-weight: 900; font-size: 26px; fill: #FFFFFF; }
    .karaoke-active { font-weight: 900; font-size: 28px; fill: #FACC15; }
  </style>

  <!-- Phone Shell Base -->
  <rect x="10" y="10" width="520" height="940" rx="44" fill="#090D16" stroke="url(#phoneBorder)" stroke-width="4" />

  <!-- Screen Container (9:16 Area) -->
  <g transform="translate(24, 24)">
    <clipPath id="screenClip">
      <rect width="492" height="912" rx="34" />
    </clipPath>

    <g clip-path="url(#screenClip)">
      <!-- ================= TOP HALF: CREATOR VIDEO (1080x960 proportional) ================= -->
      <rect x="0" y="0" width="492" height="456" fill="url(#topBg)" />
      
      <!-- Visual elements representing creator video -->
      <circle cx="246" cy="190" r="72" fill="#4338CA" opacity="0.4" />
      <circle cx="246" cy="180" r="48" fill="#6366F1" opacity="0.6" />
      <!-- Creator Avatar Outline -->
      <circle cx="246" cy="165" r="24" fill="#E0E7FF" />
      <path d="M 216 215 Q 246 195 276 215 Z" fill="#E0E7FF" />

      <!-- Top Half Badge -->
      <rect x="20" y="24" width="170" height="28" rx="14" fill="#0F172A" opacity="0.85" stroke="#475569" stroke-width="1" />
      <circle cx="34" cy="38" r="4" fill="#EF4444" />
      <text x="46" y="43" class="font-base tag-text" fill="#F8FAFC">TOP: CREATOR VIDEO</text>

      <text x="246" y="270" class="font-base header-text" text-anchor="middle">MrBeast / Speed / Nick DiGiovanni</text>
      <text x="246" y="295" class="font-base sub-text" text-anchor="middle">Preserves Original High-Fidelity Creator Audio</text>

      <!-- Waveform Simulation -->
      <g transform="translate(146, 330)">
        <rect x="0" y="10" width="4" height="20" rx="2" fill="#818CF8" />
        <rect x="10" y="4" width="4" height="32" rx="2" fill="#A5B4FC" />
        <rect x="20" y="14" width="4" height="12" rx="2" fill="#818CF8" />
        <rect x="30" y="2" width="4" height="36" rx="2" fill="#C7D2FE" />
        <rect x="40" y="8" width="4" height="24" rx="2" fill="#818CF8" />
        <rect x="50" y="0" width="4" height="40" rx="2" fill="#E0E7FF" />
        <rect x="60" y="6" width="4" height="28" rx="2" fill="#A5B4FC" />
        <rect x="70" y="12" width="4" height="16" rx="2" fill="#818CF8" />
        <rect x="80" y="4" width="4" height="32" rx="2" fill="#C7D2FE" />
        <rect x="90" y="14" width="4" height="12" rx="2" fill="#818CF8" />
        <rect x="100" y="2" width="4" height="36" rx="2" fill="#A5B4FC" />
        <rect x="110" y="8" width="4" height="24" rx="2" fill="#818CF8" />
        <rect x="120" y="16" width="4" height="8" rx="2" fill="#6366F1" />
        <rect x="130" y="6" width="4" height="28" rx="2" fill="#818CF8" />
        <rect x="140" y="12" width="4" height="16" rx="2" fill="#A5B4FC" />
        <rect x="150" y="2" width="4" height="36" rx="2" fill="#C7D2FE" />
        <rect x="160" y="8" width="4" height="24" rx="2" fill="#818CF8" />
        <rect x="170" y="14" width="4" height="12" rx="2" fill="#6366F1" />
        <rect x="180" y="6" width="4" height="28" rx="2" fill="#818CF8" />
        <rect x="190" y="10" width="4" height="20" rx="2" fill="#A5B4FC" />
      </g>


      <!-- ================= SPLIT DIVIDER & KINETIC SUBTITLES ================= -->
      <line x1="0" y1="456" x2="492" y2="456" stroke="#475569" stroke-width="2" stroke-dasharray="6,4" />

      <!-- Subtitle Box Centered over the Horizon -->
      <g transform="translate(36, 420)" filter="url(#subGlow)">
        <rect width="420" height="72" rx="16" fill="#090D16" opacity="0.92" stroke="#FACC15" stroke-width="1.8" />
        <text x="210" y="46" text-anchor="middle" class="font-base">
          <tspan class="karaoke-word">"HE </tspan>
          <tspan class="karaoke-active">ACTUALLY </tspan>
          <tspan class="karaoke-word">WON?!" 🔥</tspan>
        </text>
      </g>


      <!-- ================= BOTTOM HALF: GAMEPLAY (1080x960 proportional) ================= -->
      <rect x="0" y="456" width="492" height="456" fill="url(#bottomBg)" />

      <!-- Bottom Half Badge -->
      <rect x="20" y="476" width="180" height="28" rx="14" fill="#0F172A" opacity="0.85" stroke="#475569" stroke-width="1" />
      <circle cx="34" cy="490" r="4" fill="#10B981" />
      <text x="46" y="495" class="font-base tag-text" fill="#F8FAFC">BOTTOM: GAMEPLAY</text>

      <!-- Isometric 3D Gameplay Grid / Path Simulation -->
      <g transform="translate(126, 560)">
        <!-- Highway / Track / Minecraft blocks -->
        <polygon points="120,40 180,240 60,240" fill="#047857" opacity="0.7" />
        <polygon points="120,40 135,240 105,240" fill="#F59E0B" opacity="0.8" />
        <!-- Player Object -->
        <rect x="110" y="180" width="20" height="32" rx="4" fill="#38BDF8" />
        <!-- Floating coins -->
        <circle cx="120" cy="120" r="7" fill="#FACC15" />
        <circle cx="120" cy="90" r="7" fill="#FACC15" />
        <circle cx="120" cy="60" r="7" fill="#FACC15" />
      </g>

      <text x="246" y="830" class="font-base header-text" text-anchor="middle">GTA 5 • Minecraft • Subway Surfers</text>
      <text x="246" y="855" class="font-base sub-text" text-anchor="middle">Muted • Random Timeline Offset • Ultra-Smooth</text>
    </g>

    <!-- UI Overlay: Social Action Buttons (Right rail) -->
    <g transform="translate(436, 540)">
      <!-- Like -->
      <circle cx="20" cy="20" r="18" fill="#1E293B" opacity="0.8" />
      <text x="20" y="26" font-size="16" text-anchor="middle" fill="#EF4444">❤️</text>
      <text x="20" y="46" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#FFFFFF">124K</text>

      <!-- Comment -->
      <circle cx="20" cy="80" r="18" fill="#1E293B" opacity="0.8" />
      <text x="20" y="86" font-size="16" text-anchor="middle" fill="#FFFFFF">💬</text>
      <text x="20" y="106" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#FFFFFF">3.2K</text>

      <!-- Share -->
      <circle cx="20" cy="140" r="18" fill="#1E293B" opacity="0.8" />
      <text x="20" y="146" font-size="16" text-anchor="middle" fill="#FFFFFF">↗️</text>
      <text x="20" y="166" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#FFFFFF">Share</text>
    </g>

    <!-- Top Dynamic Island / Speaker Notch -->
    <rect x="186" y="12" width="120" height="22" rx="11" fill="#000000" />
    <circle cx="282" cy="23" r="4" fill="#1E293B" />
  </g>
</svg>
