name: 🚀 Autopilot — Autonomous Video Engine

on:
  schedule:
    # 24/7 Watchdog Heartbeat: ensures continuous 50-minute posting engine is always active
    - cron: '*/30 * * * *'
  push:
    paths:
      - 'links.txt'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Optional: Direct YouTube URL to process immediately'
        required: false
        type: string
      mode:
        description: 'Execution mode'
        required: true
        default: 'continuous_50min'
        type: choice
        options:
          - continuous_50min
          - once

concurrency:
  group: money-printer-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    name: 🎬 Autopilot, Clip & Multi-Post
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      RIGHTS_ACKNOWLEDGED: 'true'
      UPLOAD_YOUTUBE: 'true'
      UPLOAD_INSTAGRAM: 'true'
      UPLOAD_FACEBOOK: 'true'
      CYCLE_INTERVAL_MINUTES: '50'
      MAX_UPLOADS_PER_CYCLE: '1'
      MAX_CONTINUOUS_CYCLES: '5'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_MODEL: 'qwen/qwen3.8-27b'
      GROQ_FALLBACK_MODEL: 'qwen/qwen3.8-27b'
      GROQ_METADATA_DELAY_SECONDS: '1'
      SHORTS_SELECTION_MODE: 'ai_highlights'
      MAX_SHORTS_PER_VIDEO: '3'
      CLIP_DURATION_SECONDS: '60'
      VIDEO_LAYOUT: 'split_gameplay'
      ENABLE_GAMEPLAY: 'true'
      GAMEPLAY_ROTATION: 'gta5,minecraft,subway_surfers'
      ENABLE_CAPTIONS: 'true'
      CAPTION_FONT: 'Arial'
      CAPTION_FONT_SIZE: '64'
      CAPTION_HIGHLIGHT_COLORS: '&H0066FF00&,&H0000E6FF&,&H00FFFF00&'
      VIDEO_CRF: '22'
      VIDEO_PRESET: 'veryfast'
      VIDEO_ALLOW_UPSCALE: 'false'
      FREE_LLM_BASE_URL: ${{ secrets.FREE_LLM_BASE_URL || 'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1' }}
      FREE_LLM_MODEL: ${{ secrets.FREE_LLM_MODEL || 'Meta-Llama-3_3-70B-Instruct' }}
      FREE_LLM_API_KEY: ${{ secrets.FREE_LLM_API_KEY || '' }}
      YOUTUBE_TOKEN_CONTENT: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      CLIENT_SECRET_CONTENT: ${{ secrets.CLIENT_SECRET_JSON }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID || '17841432791787477' }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '1231108530089378' }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || '' }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || '' }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || '' }}
      YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
      YOUTUBE_VISITOR_DATA: ${{ secrets.YOUTUBE_VISITOR_DATA }}
      PO_TOKEN_PROVIDER_URL: 'http://127.0.0.1:4416'
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES || '' }}
      PROXY: ${{ secrets.PROXY || secrets.YOUTUBE_PROXY || '' }}
      COBALT_API_URL: ${{ secrets.COBALT_API_URL || '' }}
      COBALT_API_KEY: ${{ secrets.COBALT_API_KEY || '' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎥 Install FFmpeg, Node.js & Subtitle Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fontconfig nodejs
          fc-cache -f

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .

      - name: 🛡️ Launch PO Token Provider Container (Docker)
        run: |
          docker run --name bgutil-provider -d --restart always -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || true
          sleep 4
          curl -s http://127.0.0.1:4416/ping || true

      - name: 💾 Cache Gameplay Video Footage
        uses: actions/cache@v4
        with:
          path: assets/gameplay
          key: gameplay-footage-${{ hashFiles('assets/gameplay/README.md') }}
          restore-keys: |
            gameplay-footage-

      - name: 💾 Restore Database & Jobs Cache
        uses: actions/cache@v4
        with:
          path: |
            work/jobs.db
            work/jobs
            work/pending_uploads
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: 📁 Prepare Directories & Credentials
        run: |
          mkdir -p work queue assets/gameplay/gta5 assets/gameplay/minecraft assets/gameplay/subway_surfers
          if [ -n "$YOUTUBE_TOKEN_CONTENT" ]; then
            echo "$YOUTUBE_TOKEN_CONTENT" > youtube_token.json
            echo "✅ Materialized youtube_token.json"
          else
            echo "::warning ::YOUTUBE_TOKEN_JSON secret is empty in GitHub Secrets!"
          fi

          if [ -n "$CLIENT_SECRET_CONTENT" ]; then
            echo "$CLIENT_SECRET_CONTENT" > client_secret.json
            echo "✅ Materialized client_secret.json"
          else
            echo "::warning ::CLIENT_SECRET_JSON secret is empty in GitHub Secrets!"
          fi



      - name: 🔗 Queue Manual Input URL (if provided)
        if: ${{ inputs.youtube_url != '' }}
        run: |
          echo "Queueing direct URL: ${{ inputs.youtube_url }}"
          echo -e "\n${{ inputs.youtube_url }}" >> links.txt

      - name: 🚀 Run Health & Diagnostic Preflight
        run: |
          python -m shorts_bot.preflight

      - name: ⚡ Execute Autonomous Drip Pipeline
        run: |
          if [ "${{ inputs.mode }}" = "once" ]; then
            echo "Running single drip cycle (--once)..."
            python -m shorts_bot.file_queue --once
          else
            echo "Running continuous 50-minute drip engine..."
            python main.py
          fi

      - name: 📊 Publish Markdown Mission Control Summary
        if: always()
        run: |
          python dashboard.py --summary >> $GITHUB_STEP_SUMMARY || true

      - name: 📦 Upload Pending Uploads Artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-shorts
          path: work/pending_uploads/
          retention-days: 3
          if-no-files-found: ignore

      - name: 💾 Sync Updated Download Ledger & Queue
        if: always()
        run: |
          python -m shorts_bot.sync_ledger

      - name: 🔁 Dispatch Next Cycle Relay
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching relay runner to keep the 50-minute cycle active 24/7..."
          gh workflow run autopilot.yml -f mode=continuous_50min || true

