name: Money Printer Scheduled Automation

on:
  schedule:
    # Run every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Disk space before cleaning:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a --force || true
          echo "Disk space after cleaning:"
          df -h

      - name: Set up Cloudflare WARP (Bypass Cloud Datacenter IP Restrictions)
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: wireguard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Deno JS Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk fonts-deva

      - name: Start BGUtil PO Token Provider (Docker)
        run: |
          docker run --name bgutil-provider -d --init \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest
          echo "Waiting for BGUtil POT Provider to become ready on http://127.0.0.1:4416/ping ..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4416/ping | grep -q "version"; then
              echo "✅ BGUtil POT Provider is active and ready!"
              break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider pytubefix
          pip install -e .

      - name: Setup YouTube Token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python -c '
          import base64
          import json
          import os
          raw = os.environ.get("YOUTUBE_TOKEN_JSON", "").strip()
          token_str = ""
          if raw:
              token_str = raw
              try:
                  decoded = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  if "refresh_token" in decoded or "client_id" in decoded:
                      token_str = decoded
              except Exception:
                  pass
          elif os.path.exists("youtube_token.json"):
              token_str = open("youtube_token.json", encoding="utf-8").read().strip()

          if token_str:
              with open("youtube_token.json", "w", encoding="utf-8") as f:
                  f.write(token_str + "\n")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_f:
                  env_f.write("UPLOAD_YOUTUBE=true\n")
              print("✅ YouTube OAuth token successfully configured.")
          else:
              print("⚠️ YOUTUBE_TOKEN_JSON secret not configured in GitHub Secrets. YouTube uploads will be skipped until secret is added.")
          '

      - name: Setup YouTube Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python -c '
          import base64
          import os
          raw = os.environ.get("YOUTUBE_COOKIES", "").strip()
          if raw:
              cookies = raw
              try:
                  decoded = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  if "youtube.com" in decoded or "# Netscape" in decoded:
                      cookies = decoded
              except Exception:
                  pass
              if not cookies.startswith("# Netscape"):
                  cookies = "# Netscape HTTP Cookie File\n" + cookies
              with open("cookies.txt", "w", encoding="utf-8") as f:
                  f.write(cookies + "\n")
              config_dir = os.path.expanduser("~/.config/yt-dlp")
              os.makedirs(config_dir, exist_ok=True)
              with open(os.path.join(config_dir, "config"), "w", encoding="utf-8") as conf:
                  conf.write("--cookies cookies.txt\n")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_f:
                  env_f.write("YTDLP_COOKIE_FILE=cookies.txt\n")
              print(f"YouTube cookies successfully configured ({len(cookies.splitlines())} lines).")
          else:
              print("Notice: YOUTUBE_COOKIES secret not found or empty.")
          '

      - name: Cache Gameplay Footage Assets
        uses: actions/cache@v4
        with:
          path: assets/gameplay
          key: gameplay-footage-${{ runner.os }}-v2
          restore-keys: |
            gameplay-footage-${{ runner.os }}-

      - name: Ensure Real Gameplay Footage (GTA V, Minecraft, Subway Surfers)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python -c "from shorts_bot.gameplay import GameplayManager; GameplayManager().ensure_all_categories_ready()"

      - name: Restore Pipeline Database & State Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/jobs.db
            work/jobs.db-wal
            work/jobs.db-shm
            work/downloaded-links.log
          key: pipeline-db-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pipeline-db-state-${{ runner.os }}-

      - name: Run Money Printer Pipeline
        env:
          RIGHTS_ACKNOWLEDGED: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREELLMAPI_URL: ${{ secrets.FREELLMAPI_URL }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
          MAX_SHORTS_PER_VIDEO: ${{ vars.MAX_SHORTS_PER_VIDEO || '6' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          UPLOAD_FACEBOOK: "true"
          UPLOAD_INSTAGRAM: "true"
          UPLOAD_YOUTUBE: ${{ env.UPLOAD_YOUTUBE || 'false' }}
          KEEP_WORK_FILES: "false"
        run: |
          python main.py --once

      - name: Save Pipeline Database & State Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            work/jobs.db
            work/jobs.db-wal
            work/jobs.db-shm
            work/downloaded-links.log
          key: pipeline-db-state-${{ runner.os }}-${{ github.run_id }}

      - name: Publish Live Mission Control Dashboard to GitHub Summary
        if: always()
        run: |
          python dashboard.py --summary >> $GITHUB_STEP_SUMMARY
          python dashboard.py --html public/index.html
          echo ""
          echo "================================================================================="
          echo "🚀 MONEY PRINTER MISSION CONTROL DASHBOARD IS LIVE!"
          echo "👉 Click this link to open the Summary tab on GitHub:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "👉 Localhost Port (if you run locally on PC): http://localhost:5050"
          echo "================================================================================="

      - name: Upload Live Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mission-control-dashboard
          path: public/index.html

      - name: Sync Updated Queue and Logs to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.txt work/downloaded-links.log || true
          git commit -m "chore(autopilot): update links.txt queue [skip ci]" || true
          git push || true
