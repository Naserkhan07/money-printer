[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "money-printer"
version = "1.0.0"
description = "Money Printer: turns authorized videos into AI-planned Shorts/Reels, renders them locally, and publishes to YouTube, Instagram, Facebook and TikTok."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naveed" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "cloudinary>=1.44,<2",
  "google-api-python-client>=2.160,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "groq>=0.31,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pytubefix>=11.2",
  "yt-dlp[curl-cffi,default,deno]>=2026.7.4",
  "yt-dlp-ejs>=0.8,<1",
  "bgutil-ytdlp-pot-provider>=2.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
shorts-local = "shorts_bot.file_queue:main"
shorts-cli = "shorts_bot.cli:main"
shorts-queue = "shorts_bot.file_queue:main"
shorts-autopilot = "shorts_bot.autopilot:main"
shorts-insights = "shorts_bot.insights:main"
shorts-auth = "shorts_bot.youtube_auth:main"
instagram-long-token = "shorts_bot.instagram_token:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shorts_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
