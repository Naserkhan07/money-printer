# ====================================================================
# Render Blueprint (Infrastructure-as-Code)
# https://render.com/docs/blueprint-spec
# ====================================================================
services:
  # Main Unified Web Service:
  # Serves the Live Mission Control Dashboard on $PORT and supervises
  # the 24/7 background video downloading, AI clipping, and multi-posting engine.
  - type: web
    name: money-printer
    runtime: docker
    dockerfilePath: Dockerfile
    region: oregon
    plan: starter  # Starter ($7/mo) recommended for continuous background CPU rendering; or 'free'
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000

      # Primary & Free AI Engines
      - key: GROQ_API_KEY
        sync: false
      - key: FREE_LLM_BASE_URL
        value: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
      - key: FREE_LLM_MODEL
        value: Meta-Llama-3_3-70B-Instruct
      - key: FREE_LLM_API_KEY
        sync: false

      # 24/7 Production & Multi-Slot Batching
      - key: MIN_UPLOADS_PER_SLOT
        value: "3"
      - key: UPLOAD_YOUTUBE
        value: "true"
      - key: UPLOAD_INSTAGRAM
        value: "true"
      - key: UPLOAD_FACEBOOK
        value: "true"

      # Platform Credentials
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        value: "17841432791787477"
      - key: FACEBOOK_PAGE_ID
        value: "1231108530089378"
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false

      # Materialized Secret Files (Paste raw file contents directly into Render)
      - key: YOUTUBE_TOKEN_CONTENT
        sync: false
      - key: YOUTUBE_CLIENT_SECRETS_CONTENT
        sync: false
      - key: YOUTUBE_COOKIES_CONTENT
        sync: false

      # Optional Video Enhancement (Cloudinary)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
